name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  MPV_TAG: 2026-08-25-654e9382c0
  MPV_ARCHIVE: mpv-dev-x86_64-20260825-git-654e9382c0.7z
  MPV_SHA256: 02a800cb2f588594a706a0ef76193fce50bc80786fb1dcb625c0096628e67b0a
  VULKAN_RT_VERSION: 1.4.357.0
  VULKAN_RT_ARCHIVE: VulkanRT-X64-1.4.357.0-Components.zip
  VULKAN_RT_SHA256: a14672efed15aafc7f5a16572d35cd3a3416eadf670aeee3cdf50ee32d5fbf83

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # Pin the exact archive and verify its digest before extracting.
      - name: Download libmpv dev package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:MPV_TAG -R zhongfly/mpv-winbuild --pattern $env:MPV_ARCHIVE --dir .
          if ($LASTEXITCODE -ne 0) { throw "failed to download pinned libmpv archive" }
          $actual = (Get-FileHash $env:MPV_ARCHIVE -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:MPV_SHA256) { throw "libmpv archive checksum mismatch: $actual" }
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          & $sevenZip x $env:MPV_ARCHIVE '-y' '-othird_party/mpv' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z extraction failed" }
          $required = @('third_party/mpv/libmpv-2.dll', 'third_party/mpv/include/mpv/client.h')
          $missing = $required | Where-Object { -not (Test-Path $_ -PathType Leaf) }
          if ($missing) { throw "libmpv archive is missing: $($missing -join ', ')" }

      - name: Generate MSVC import library
        shell: pwsh
        run: |
          # 包内 DLL 已是 libmpv-2.dll；以防万一处理旧命名
          if (-not (Test-Path third_party/mpv/libmpv-2.dll) -and (Test-Path third_party/mpv/mpv-2.dll)) {
            Move-Item third_party/mpv/mpv-2.dll third_party/mpv/libmpv-2.dll
          }
          if (-not (Test-Path third_party/mpv/libmpv-2.lib)) {
            # 2026-08 起的 mpv-dev 包只含 include/、libmpv-2.dll、libmpv.dll.a，
            # 不再附带 mpv.def —— 用 dumpbin 从 DLL 导出表生成 def，再产出导入库
            'LIBRARY "libmpv-2.dll"', 'EXPORTS' | Set-Content third_party/mpv/mpv.def
            dumpbin /exports third_party/mpv/libmpv-2.dll |
              Select-String '^\s+\d+\s+[0-9A-Fa-fxX]+\s+[0-9A-Fa-fxX]+\s+(\S+)$' |
              ForEach-Object { '  ' + $_.Matches[0].Groups[1].Value } |
              Add-Content third_party/mpv/mpv.def
            lib "/def:third_party/mpv/mpv.def" /name:libmpv-2.dll /out:third_party/mpv/libmpv-2.lib /machine:x64
          }
          # 硬校验：导入库必须真的包含 mpv 符号（空 /def: 会静默生成空库导致链接失败）
          if (-not (dumpbin /linkermember third_party/mpv/libmpv-2.lib | Select-String 'mpv_create')) {
            throw 'libmpv-2.lib 不含 mpv 符号：导入库生成失败'
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # The pinned libmpv imports vulkan-1.dll, which headless hosted runners
      # do not provide. Deploy both native DLLs beside Cargo's test harnesses.
      - name: Deploy native test dependencies
        shell: pwsh
        run: |
          $imports = (dumpbin /dependents third_party\mpv\libmpv-2.dll | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'failed to inspect libmpv dependencies' }
          if ($imports -notmatch '(?im)^\s+vulkan-1\.dll\s*$') {
            throw 'pinned libmpv no longer imports vulkan-1.dll; review the CI runtime provisioning'
          }

          $runtimeArchive = Join-Path $env:RUNNER_TEMP $env:VULKAN_RT_ARCHIVE
          $runtimeDir = Join-Path $env:RUNNER_TEMP 'vulkan-runtime'
          $runtimeUri = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_RT_VERSION/windows/$env:VULKAN_RT_ARCHIVE"
          curl.exe --fail --location --retry 3 --output $runtimeArchive $runtimeUri
          if ($LASTEXITCODE -ne 0) { throw 'failed to download pinned Vulkan runtime components' }
          $actual = (Get-FileHash $runtimeArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:VULKAN_RT_SHA256) { throw "Vulkan runtime archive checksum mismatch: $actual" }
          Expand-Archive -LiteralPath $runtimeArchive -DestinationPath $runtimeDir -Force
          $vulkanLoader = Join-Path $runtimeDir "VulkanRT-X64-$env:VULKAN_RT_VERSION-Components\x64\vulkan-1.dll"
          if (-not (Test-Path $vulkanLoader -PathType Leaf)) { throw "Vulkan loader not found: $vulkanLoader" }

          New-Item -ItemType Directory -Force target\debug\deps | Out-Null
          Copy-Item third_party\mpv\libmpv-2.dll target\debug\deps\libmpv-2.dll -Force
          Copy-Item $vulkanLoader target\debug\deps\vulkan-1.dll -Force

      - name: Test
        run: cargo test --locked --all-targets --all-features

      # The hosted Windows image no longer guarantees ffmpeg. Use libmpv's
      # own lavfi input, so this integration test has no unpinned tool dependency.
      - name: Test real thumbnail pipeline
        shell: pwsh
        env:
          NEKO_TEST_MEDIA: av://lavfi:testsrc2=duration=8:size=640x360:rate=24
          NEKO_TEST_DURATION: 8
        run: cargo test --locked generates_thumbnail_per_request -- --ignored --nocapture

      - name: Build
        run: cargo build --release --locked

      # Signing remains optional, but partially configured credentials fail closed.
      - name: Sign neko-player.exe
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrEmpty($env:CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrEmpty($env:CERTIFICATE_PASSWORD)
          if ($hasCertificate -xor $hasPassword) { throw 'signing credentials are only partially configured' }
          if (-not $hasCertificate) {
            Write-Host '::notice::未配置签名证书 secrets，跳过代码签名。'
            exit 0
          }
          $cert = Join-Path $env:RUNNER_TEMP 'neko-player-cert.pfx'
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object FullName -Match '\\x64\\' | Sort-Object FullName | Select-Object -Last 1).FullName
          if (-not $signtool) { throw 'x64 signtool.exe not found' }
          & $signtool sign /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 `
            /f $cert /p $env:CERTIFICATE_PASSWORD target\release\neko-player.exe
          if ($LASTEXITCODE -ne 0) { throw 'executable signing failed' }
          & $signtool verify /pa target\release\neko-player.exe
          if ($LASTEXITCODE -ne 0) { throw 'executable signature verification failed' }

      - name: Package ZIP
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $packages = @($metadata.packages | Where-Object name -eq 'neko-player')
          if ($packages.Count -ne 1) { throw "expected one neko-player package, found $($packages.Count)" }
          $version = $packages[0].version
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "release tag $env:GITHUB_REF_NAME does not match Cargo version v$version"
          }
          "VERSION=$version" | Add-Content $env:GITHUB_ENV
          Compress-Archive -Path target\release\neko-player.exe, target\release\libmpv-2.dll, LICENSE, THIRD_PARTY_NOTICES.md `
            -DestinationPath "neko-player-v$version-windows-x64.zip"
          if (-not (Test-Path "neko-player-v$version-windows-x64.zip" -PathType Leaf)) { throw 'portable ZIP was not created' }

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc -PathType Leaf)) { throw "ISCC.exe not found: $iscc" }
          & $iscc "/DMyAppVersion=$env:VERSION" installer\neko-player.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          $installer = "dist\neko-player-setup-$env:VERSION.exe"
          if (-not (Test-Path $installer -PathType Leaf)) { throw "installer was not created: $installer" }

      - name: Sign installer
        shell: pwsh
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          $cert = Join-Path $env:RUNNER_TEMP 'neko-player-cert.pfx'
          if (-not (Test-Path $cert -PathType Leaf)) {
            Write-Host '::notice::未配置签名证书 secrets，跳过代码签名。'
            exit 0
          }
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object FullName -Match '\\x64\\' | Sort-Object FullName | Select-Object -Last 1).FullName
          if (-not $signtool) { throw 'x64 signtool.exe not found' }
          $installer = "dist\neko-player-setup-$env:VERSION.exe"
          & $signtool sign /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 `
            /f $cert /p $env:CERTIFICATE_PASSWORD $installer
          if ($LASTEXITCODE -ne 0) { throw 'installer signing failed' }
          & $signtool verify /pa $installer
          if ($LASTEXITCODE -ne 0) { throw 'installer signature verification failed' }
          Remove-Item -Force $cert

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = @("neko-player-v$env:VERSION-windows-x64.zip", "dist\neko-player-setup-$env:VERSION.exe")
          $lines = foreach ($file in $files) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "release artifact missing: $file" }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neko-player-windows-x64
          path: |
            neko-player-v*-windows-x64.zip
            dist/neko-player-setup-*.exe
            SHA256SUMS.txt
            THIRD_PARTY_NOTICES.md
            LICENSE


  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          name: neko-player-windows-x64
          path: release-assets

      - name: Verify and create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $zipName = "neko-player-v$version-windows-x64.zip"
          $installerName = "neko-player-setup-$version.exe"
          $zip = "release-assets\$zipName"
          $installer = "release-assets\dist\$installerName"
          $checksums = 'release-assets\SHA256SUMS.txt'
          $files = @($zip, $installer, $checksums, 'release-assets\THIRD_PARTY_NOTICES.md', 'release-assets\LICENSE')
          $missing = $files | Where-Object { -not (Test-Path $_ -PathType Leaf) }
          if ($missing) { throw "missing release assets: $($missing -join ', ')" }

          $expectedNames = @($zipName, $installerName)
          $entries = @{}
          foreach ($line in Get-Content $checksums) {
            if ($line -notmatch '^([0-9a-f]{64})  ([^\/]+)$') { throw "invalid checksum line: $line" }
            if ($entries.ContainsKey($Matches[2])) { throw "duplicate checksum entry: $($Matches[2])" }
            $entries[$Matches[2]] = $Matches[1]
          }
          if ($entries.Count -ne 2 -or @($expectedNames | Where-Object { -not $entries.ContainsKey($_) }).Count -ne 0) {
            throw 'checksum manifest does not contain the exact expected artifacts'
          }
          foreach ($artifact in @($zip, $installer)) {
            $name = [IO.Path]::GetFileName($artifact)
            $actual = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $entries[$name]) { throw "checksum mismatch: $name" }
          }

          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) { throw "release already exists: $env:GITHUB_REF_NAME" }
          gh release create $env:GITHUB_REF_NAME --generate-notes --latest @files
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed' }
